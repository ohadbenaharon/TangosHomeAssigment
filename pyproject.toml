[project]
name = "orchestrator"
version = "0.1.0"
description = "Investigation orchestrator: screens counterparties across sanctions, adverse media and a corporate registry."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
orchestrator = "orchestrator.cli:main"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["orchestrator", "tests", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["registry_service.py"]  # provided service, kept verbatim

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
